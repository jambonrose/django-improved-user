name: Package Tests

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]
        paths:
          - .github/**
          - src/**
          - tests/**
          - pyproject.toml
          - uv.lock


env:
    PYTHONDONTWRITEBYTECODE: 1
    PYTHONWARNINGS: once

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, windows-2022]
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
                django-version: ["4.2", "5.2", "6.0"]
                exclude:
                    # Django 4.2 only supports Python up to 3.12
                    - python-version: "3.13"
                      django-version: "4.2"
                    - python-version: "3.14"
                      django-version: "4.2"
                    # Django 6.0 requires Python 3.12+
                    - python-version: "3.10"
                      django-version: "6.0"
                    - python-version: "3.11"
                      django-version: "6.0"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
              with:
                  enable-cache: true

            - name: Install dependencies
              run: |
                  uv sync --frozen --group dev --no-install-package django
                  uv pip install "Django~=${{ matrix.django-version }}"

            - name: Python and Django versions
              run: |
                  echo "Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}"
                  uv run --no-sync python --version
                  echo "Django: $(uv run --no-sync django-admin --version)"

            - name: Run tests
              run: |
                  uv run --no-sync coverage run ./runtests.py
                  uv run --no-sync coverage combine --append
                  uv run --no-sync coverage report
                  uv run --no-sync coverage xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v6
              with:
                  fail_ci_if_error: true
                  verbose: true
