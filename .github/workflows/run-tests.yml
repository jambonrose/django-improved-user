name: Package Tests

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]
        paths:
          - .github/**
          - src/**
          - tests/**
          - pyproject.toml
          - requirements.txt


env:
    PYTHONDONTWRITEBYTECODE: 1
    PYTHONWARNINGS: once

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, windows-2022]
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
                django-version: ["4.2", "5.2"]
                exclude:
                    # Django 4.2 only supports Python up to 3.12
                    - python-version: "3.13"
                      django-version: "4.2"
                    - python-version: "3.14"
                      django-version: "4.2"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Upgrade pip
              run: python3 -m pip install -U distlib pip setuptools wheel

            - name: Get pip cache dir
              id: pip-cache
              shell: bash
              run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.pip-cache.outputs.dir }}
                  key:
                      ${{ runner.os }}-pip-${{ matrix.django-version }}-${{
                      hashFiles('./requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python3 -m pip install -r ./requirements.txt
                  python3 -m flit install --deps none

            - name: Install Django
              run: python3 -m pip install "Django~=${{ matrix.django-version }}"

            - name: Python and Django versions
              run: |
                  echo "Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}"
                  python3 --version
                  echo "Django: $(django-admin --version)"

            - name: Run tests
              run: |
                  coverage run ./runtests.py
                  coverage combine --append
                  coverage report
                  coverage xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: true
                  verbose: true
