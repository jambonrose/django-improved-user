name: Package Tests

on:
    push:
        branches: [development]
    pull_request:
        branches: [development]
        paths:
          - .github/**
          - src/**
          - tests/**
          - pyproject.toml
          - requirements.txt


env:
    PYTHONDONTWRITEBYTECODE: 1
    PYTHONWARNINGS: once

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-22.04, windows-2022]
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
                django-version: ["4.2", "5.2"]
                exclude:
                    # Django 4.2 only supports Python up to 3.12
                    - python-version: "3.13"
                      django-version: "4.2"
                    - python-version: "3.14"
                      django-version: "4.2"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Install dependencies
              run: |
                  uv sync --group dev
                  uv pip install "Django~=${{ matrix.django-version }}"

            - name: Python and Django versions
              run: |
                  echo "Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}"
                  uv run python --version
                  echo "Django: $(uv run django-admin --version)"

            - name: Run tests
              run: |
                  uv run coverage run ./runtests.py
                  uv run coverage combine --append
                  uv run coverage report
                  uv run coverage xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: true
                  verbose: true
